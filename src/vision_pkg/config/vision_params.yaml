side_camera_node:
  ros__parameters:
    source_mode: "image_dir"
    camera_index: 0
    video_path: ""
    image_loop: true

    # 성능 제한용
    publish_rate_hz: 7.0
    frame_width: 640
    frame_height: 480

liquid_height_detector_node:
  ros__parameters:
    device: "0" #"cpu"
    confidence_threshold: 0.35

    # YOLO 추론 옵션
    yolo_imgsz: 640
    yolo_iou_threshold: 0.5
    yolo_max_det: 20

    # tube 개수
    num_tubes: 3

    # 기존 mm 변환 대신 percent 사용
    output_unit: "percent"

    # height 결과 안정화
    height_buffer_size: 5
    height_publish_min_samples: 3
    height_filter_method: "median"

    # hand safety 안정화
    hand_safety_enabled: true
    hand_detect_consecutive_frames: 3
    hand_lost_consecutive_frames: 2

    camera_timeout_sec: 3.0

tube_state_publisher_node:
  ros__parameters:
    # 이제 liquid_height를 percent로 해석
    target_height: 50.0
    tolerance: 10.0
    # 260624 jiwan
    # refill_min: 30.0
    # overflow_max: 70.0
    # end
    confidence_threshold: 0.35