side_camera_node:
  ros__parameters:
    source_mode: "image_dir"
    camera_index: 0
    video_path: ""
    image_loop: true

    # 성능 제한용
    publish_rate_hz: 7.0
    frame_width: 640
    frame_height: 480

    # 260624 jiwan side_image가 raw bgr8(921KB)라 BEST_EFFORT에서 드롭되던 문제 ->
    # JPEG 압축 전송으로 변경, quality는 0~100 (낮을수록 용량 작고 손실 큼)
    jpeg_quality: 90
    # end

liquid_height_detector_node:
  ros__parameters:
    device: "cpu" #"cpu"
    confidence_threshold: 0.35

    # YOLO 추론 옵션
    yolo_imgsz: 640
    yolo_iou_threshold: 0.5
    yolo_max_det: 20

    # tube 개수
    num_tubes: 3

    # 기존 mm 변환 대신 percent 사용
    output_unit: "percent"

    # 260624 jiwan 동적 slot anchor 매칭 tolerance (px). cup이 num_tubes개 동시에
    # 보이는 시점에 anchor를 부트스트랩하고, 이후 매 프레임 이 범위 안에서만 매칭
    slot_x_tolerance_px: 80.0
    row_y_tolerance_px: 35.0
    # end

    # 오른쪽 성공 트레이 등 화면 외곽 노이즈 차단용 ROI (x축 범위, px).
    # cup/height 박스의 center-x가 이 범위 밖이면 부트스트랩/매칭 모두 무시.
    # 기본값: 앵커 최우측(458) + tolerance(80) + 여유(2) = 540
    roi_x_min_px: 0.0
    roi_x_max_px: 540.0

    # hand 감지 ROI: 화면 상단(로봇 팔 오인식 구간) 제외용 y축 하한 (px).
    # cy < hand_roi_y_min_px 인 박스는 hand 감지에서 무시한다.
    # 640x480 기준 로봇 팔이 주로 y 0~250 에 위치하므로 250으로 설정.
    # 실제 사람 손이 들어오는 영역이 더 위쪽이라면 값을 낮춰야 함.
    # hand_roi_y_min_px: 250.0
    hand_roi_y_min_px: 1.0

    # height 결과 안정화
    height_buffer_size: 5
    height_publish_min_samples: 3
    height_filter_method: "median"

    # hand 감지 안정화
    hand_detect_consecutive_frames: 3
    hand_lost_consecutive_frames: 2

    camera_timeout_sec: 3.0

tube_state_publisher_node:
  ros__parameters:
    # 이제 liquid_height를 percent로 해석
    target_height: 50.0
    tolerance: 10.0
    # 260624 jiwan
    # refill_min: 30.0
    # overflow_max: 70.0
    # end
    confidence_threshold: 0.35