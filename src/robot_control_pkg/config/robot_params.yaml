# All poses are [x, y, z, rx, ry, rz] in the Doosan posx convention (mm, deg).
#
# Physical layout: 3 trays (3x1 each) sit stacked in depth in front of the
# robot/camera; only the front-most tray (tray_idx) is ever active.
#   - tray_tool_stand_*: tray transfer tool pickup/return station (fixed)
#   - tray_transfer_*: tray tool insertion, lift, success-zone placement, detach (per tray_idx)
#   - refill_source_*: refill tube pickup/return station (fixed)
#   - refill_target_{tray_idx}_{tube_idx}_*: refill target tube approach/work/pour poses
#   - dispose_tray_{tray_idx}_tube_{tube_idx}_*: dispose target tube approach/grip poses
#
# tray_gap/tube_gap/tray_crood/tube_crood are NOT consumed by any node at
# runtime - they're kept as reference for filling in/estimating poses that
# haven't been taught on the real robot yet (every pose is independently
# overridable in case real-world placement drifts from the ideal spacing).
#
# Entries marked "TODO: 실측 필요" are tray_gap-offset estimates from
# tray_idx 0 and must be re-taught on the real robot before relying on them.

