# All poses are [x, y, z, rx, ry, rz] in the Doosan posx convention (mm, deg),
# matching the format used by movej/movel/posx in DSR_ROBOT2. Values below are
# placeholder coordinates for the mock controller; replace with the real
# taught/calibrated poses when wiring up doosan_robot2 + the physical M0609.
#
# Design rule (spec doc section 13): every coordinate is split into an
# "approach" pose (safe height above the tube) and a "pick"/"refill" pose
# (the actual working height), so the arm always descends/retreats vertically.

doosan_robot_control_node:
  ros__parameters:
    m_velocity: 60.0
    m_acceleration: 60.0
    d_velocity: 30.0
    d_acceleration: 30.0
    tray_gap : 50
    tray_crood : 0

    pose_names: [
      "home_pose",
      "waste_pose",
      "waste_down_pose",
      "normal_tray_approach_pose",
      "normal_tray_pose",
      "tray_pick_pose",
      "pick_tool_pose", "pick_tool_down_pose",
      "refill_pose",
      "tube_0_approach_pose", "tube_0_pick_pose", "tube_0_refill_pose",
      "tube_1_approach_pose", "tube_1_pick_pose", "tube_1_refill_pose",
      "tube_2_approach_pose", "tube_2_pick_pose", "tube_2_refill_pose"
    ]

    #기본 위치(트레이 중앙)
    poses.home_pose: [400.0, 0.0, 350.0, 90.0, 180.0, -90.0]
    #폐기 상단 위치
    poses.waste_pose: [200.0, -200.0, 350.0, 90.0, 180.0, -90.0]
    #폐기 하단 위치
    poses.waste_down_pose: [200.0, -200.0, 160.0, 90.0, 180.0, -90.0]
    #트레이 상단 위치(정상 상태인 트레이 놓는 위치)
    poses.normal_tray_approach_pose: [500.0, 350.0, 350.0, 90.0, 180.0, -90.0]
    #트레이 하단 위치(정상 상태인 트레이 놓는 위치)
    poses.normal_tray_pose: [500.0, 350.0, 350.0, 90.0, 180.0, -90.0]
    #트레이 하단 위치(정상 상태인 트레이 잡는 위치)
    poses.tray_pick_pose: [400.0, 0.0, 180.0, 90.0, 180.0, -90.0]

    #트레이 픽업 기기 상단 위치
    poses.pick_tool_pose : [300.0, 350.0, 350.0, 90.0, 180.0, -90.0]
    #트레이 픽업 기기 하단 위치
    poses.pick_tool_down_pose : [300.0, 350.0, 350.0, 90.0, 180.0, -90.0]

    #refill용 튜브 위치
    poses.refill_pose: [300.0, 300.0, 350.0, 90.0, 180.0, -90.0]

    #tube 상단 위치
    poses.tube_0_approach_pose: [400.0, 0.0, 300.0, 90.0, 180.0, -90.0]
    #tube 하단 위치
    poses.tube_0_pick_pose: [400.0, 0.0, 160.0, 90.0, 180.0, -90.0]
    #tube refill 위치(공중에서 기울이는 위치)
    poses.tube_0_refill_pose: [400.0, 0.0, 220.0, 90.0, 180.0, -90.0]

    poses.tube_1_approach_pose: [350.0, 0.0, 300.0, 90.0, 180.0, -90.0]
    poses.tube_1_pick_pose: [350.0, 0.0, 160.0, 90.0, 180.0, -90.0]
    poses.tube_1_refill_pose: [350.0, 0.0, 220.0, 90.0, 180.0, -90.0]

    poses.tube_2_approach_pose: [450.0, 0.0, 300.0, 90.0, 180.0, -90.0]
    poses.tube_2_pick_pose: [450.0, 0.0, 160.0, 90.0, 180.0, -90.0]
    poses.tube_2_refill_pose: [450.0, 0.0, 220.0, 90.0, 180.0, -90.0]

robot_task_manager_node:
  ros__parameters:
    num_tubes: 3
    grip_retry_count: 1
    recheck_timeout_sec: 5.0
    # 260624 jiwan refill 반복 보충 루프 안전 상한 (무한루프 방지)
    max_pour_attempts: 5
    # end

main_decision_node:
  ros__parameters:
    num_tubes: 3
    #20260624 준형, decision_cooldown_sec 사용하지 않음으로 주석처리
    # decision_cooldown_sec: 1.0
