# All poses are [x, y, z, rx, ry, rz] in the Doosan posx convention (mm, deg),
# matching the format used by movej/movel/posx in DSR_ROBOT2.
#
# Physical layout: 3 trays (3x1 each) sit stacked in depth in front of the
# robot/camera; only the front-most tray (tray_idx) is ever active. Each
# pose below is taught/calibrated independently rather than computed from
# tray_gap/tube_gap at runtime, since real-world placement can drift from
# the ideal spacing - tray_gap/tube_gap are kept as reference values for
# filling in new poses by hand, not consumed by any node.
#
# Entries marked "TODO: 실측 필요" are rough placeholders copied from
# tray_idx 0 / tube_idx 0 and must be re-taught on the real robot.

